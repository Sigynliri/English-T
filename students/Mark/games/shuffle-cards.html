<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shuffle the Cards</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e9f6ff;--fg:#2b2b2b;--card:#fff;--ac:#ff7a00;--back:#3b82f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c242d;--fg:#f1f1f1;--card:#33404d;--back:#2563eb}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS",Arial,sans-serif;text-align:center;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:2rem;margin:4px 0;color:var(--ac)}
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.card{perspective:600px;cursor:pointer;min-height:190px}
.in{position:relative;width:100%;height:100%;min-height:190px;transition:transform .5s;transform-style:preserve-3d}
.card.down .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.15);padding:8px}
.f{background:var(--card)}
.b{background:var(--back);color:#fff;font-size:4rem;transform:rotateY(180deg)}
.e{font-size:5rem;line-height:1}
.f img{max-width:100%;max-height:140px;border-radius:10px}
.w{font-size:1.5rem;font-weight:bold;min-height:1.9rem}
.card.shake{animation:sh .18s}
@keyframes sh{0%{transform:rotate(-6deg) scale(.95)}50%{transform:rotate(6deg) scale(.95)}100%{transform:none}}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;background:var(--ac);color:#fff;font-size:1.3rem;padding:12px 20px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
button.g{background:#7a7a7a}
</style></head>
<body><main>
<h1>Shuffle the Cards 🔀</h1>
<div class="board" id="board"></div>
<div class="btns">
 <button id="sh">🔀 Перемешать</button>
 <button class="g" id="fl">🔄 Перевернуть все</button>
 <button class="g" id="wd">🔤 Слова: вкл/выкл</button>
</div>
<p style="font-size:.9rem;opacity:.75">Нажмите на карточку, чтобы перевернуть её. «Перемешать» меняет места карточек.</p>
</main>
<script>
// ВСТАВЬТЕ СВОИ КАРТИНКИ СЮДА. Путь к файлу ('ax.png') или data:image/... base64.
// Пустая строка = смайлик. Слова можно заменить на любые.
const CARDS=[
 {word:'ax',img:'',emo:'🪓'},
 {word:'ant',img:'',emo:'🐜'},
 {word:'apple',img:'',emo:'🍎'},
 {word:'alligator',img:'',emo:'🐊'}
];
const $=id=>document.getElementById(id);
let order=[0,1,2,3],down=[false,false,false,false],words=true,busy=false;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(shake){
 $('board').innerHTML='';
 order.forEach(i=>{
  const c=CARDS[i],d=document.createElement('div');
  d.className='card'+(down[i]?' down':'')+(shake?' shake':'');
  d.innerHTML='<div class="in"><div class="f">'+(c.img?'<img src="'+c.img+'" alt="'+c.word+'">':'<div class="e">'+c.emo+'</div>')+'<div class="w">'+(words?c.word:'')+'</div></div><div class="b">❓</div></div>';
  d.onclick=()=>{down[i]=!down[i];d.classList.toggle('down',down[i])};
  $('board').appendChild(d);
 });
}
async function doShuffle(){
 if(busy)return;busy=true;
 let prev=order.join();
 for(let k=0;k<7;k++){order=shuffle(order);render(true);await new Promise(r=>setTimeout(r,170))}
 while(order.join()==prev)order=shuffle(order);
 render(false);busy=false;
}
$('sh').onclick=doShuffle;
$('fl').onclick=()=>{const t=!down.every(Boolean);down=down.map(()=>t);render(false)};
$('wd').onclick=()=>{words=!words;render(false)};
render(false);
</script></body></html>
