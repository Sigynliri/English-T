<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Listen and stick: classroom words</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
<style>
:root{--bg:#fff;--ink:#2b2b2b;--blue:#1fb2e6;--org:#f26b2b;--grn:#7ec241;--ok:#2e9e4f;--bad:#e0344a;--soft:#eaf8fd;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17222b;--ink:#f1f4f6;--soft:#1d3340}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Fredoka",system-ui,sans-serif;padding:16px;min-height:100vh;-webkit-user-select:none;user-select:none}
.wrap{max-width:980px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{margin:0;font-size:1.6rem;font-weight:600;line-height:1.15}
h1 small{display:block;font-size:1rem;font-weight:400;opacity:.75}
.bank{border:5px solid var(--blue);border-radius:26px;padding:10px 18px;display:flex;gap:14px;flex-wrap:wrap;min-height:70px;align-items:center;background:var(--soft)}
.chip{font:inherit;font-size:1.7rem;font-weight:500;padding:4px 18px;border-radius:14px;background:var(--bg);color:var(--ink);border:3px solid var(--blue);cursor:grab;touch-action:none;transition:transform .1s}
.chip.sel{background:var(--blue);color:#fff;transform:scale(1.08)}
.chip.drag{position:fixed;z-index:50;pointer-events:none;transform:scale(1.12) rotate(-3deg);box-shadow:0 8px 18px #0004}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0}
@media (max-width:680px){.grid{grid-template-columns:1fr}}
.card{position:relative;border-radius:22px;overflow:hidden;background:#a8dad7}
.card img{display:block;width:100%;pointer-events:none}
.num{position:absolute;left:10px;top:10px;width:34px;height:34px;border-radius:50%;background:var(--grn);color:#fff;font-weight:600;display:grid;place-items:center;font-size:1.1rem;z-index:2}
.bub{background:#fff;color:#2b2b2b;border:4px solid var(--org);border-radius:24px;padding:10px 16px;font-size:1.45rem;text-align:center;margin:0 0 -8px 46px;position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;cursor:pointer}
.cardwrap{background:var(--bg)}
.gap{display:inline-block;min-width:110px;height:44px;border-bottom:3px solid #2b2b2b;border-radius:6px 6px 0 0;text-align:center;line-height:42px;font-weight:600;transition:background .15s}
.gap.over{background:#fff1c9}
.gap.ok{color:var(--ok);border-color:var(--ok);background:#e6f7ea}
.gap.shake{animation:sh .35s;border-color:var(--bad);background:#fde5e8}
@keyframes sh{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.gap.shake{animation:none}}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.msg{font-size:1.25rem;font-weight:500;min-height:1.6em}
.btn{font:inherit;font-weight:500;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:9px 22px;cursor:pointer;font-size:1.05rem}
.btn:focus-visible,.chip:focus-visible,.bub:focus-visible{outline:3px solid var(--org);outline-offset:3px}
.win{background:var(--ok);color:#fff;border-radius:18px;padding:14px 18px;font-size:1.3rem;text-align:center;margin-top:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Listen and stick.<small>Then write the words.</small></h1>
  <div class="bank" id="bank" aria-label="Word bank"></div>
</header>
<div class="grid" id="grid"></div>
<div class="bar"><div class="msg" id="msg">Drag a word into the gap, or tap a word and then tap a gap.</div>
<div><button class="btn" id="reset">Play again</button></div></div>
<div class="win" id="win" hidden>Well done! All the words are in the right place. 🎉</div>
</div>

var bank=document.getElementById("bank"),grid=document.getElementById("grid"),msg=document.getElementById("msg"),win=document.getElementById("win");
var sel=null,done=0,mistakes=0;
function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function build(){
  bank.innerHTML="";grid.innerHTML="";done=0;mistakes=0;sel=null;win.hidden=true;
  msg.textContent="Drag a word into the gap, or tap a word and then tap a gap.";
  WORDS.slice().sort(function(){return Math.random()-.5}).forEach(function(w){
    var b=document.createElement("button");b.className="chip";b.textContent=w;b.dataset.w=w;bank.appendChild(b);
    b.addEventListener("click",function(){if(b.dataset.moved)return;pick(b)});
    b.addEventListener("pointerdown",function(e){startDrag(e,b)});
  });
  Q.forEach(function(q,i){
    var c=document.createElement("div");c.className="cardwrap";
    c.innerHTML='<div class="bub" tabindex="0" role="button" aria-label="Listen"><span>'+q[0]+'</span><span class="gap" data-i="'+i+'" tabindex="0"></span><span>'+q[2]+'</span></div>'+
    '<div class="card"><span class="num">'+(i+1)+'</span><img alt="" src="'+IMG[i]+'"></div>';
    grid.appendChild(c);
    var g=c.querySelector(".gap");
    g.addEventListener("click",function(e){e.stopPropagation();if(sel)place(sel,g)});
    c.querySelector(".bub").addEventListener("click",function(){say(q[0]+" "+(g.textContent||"")+q[2])});
  });
}
function pick(b){if(sel)sel.classList.remove("sel");sel=(sel===b)?null:b;if(sel)sel.classList.add("sel")}
function place(chip,g){
  if(g.classList.contains("ok"))return;
  var ok=Q[+g.dataset.i][3].indexOf(chip.dataset.w)>-1;
  if(ok){g.textContent=chip.dataset.w;g.classList.add("ok");chip.remove();sel=null;done++;
    var q=Q[+g.dataset.i];say(q[0]+" "+chip.dataset.w+q[2]);
    msg.textContent="Great! ✓";
    if(done===Q.length){win.hidden=false;msg.textContent=mistakes?("Mistakes: "+mistakes):"No mistakes!"}
  }else{mistakes++;g.textContent=chip.dataset.w;g.classList.add("shake");
    msg.textContent="Try again!";chip.classList.remove("sel");sel=null;
    setTimeout(function(){g.classList.remove("shake");g.textContent=""},500)}
}
function startDrag(e,chip){
  var sx=e.clientX,sy=e.clientY,moving=false,ghost=null;chip.dataset.moved="";
  function mv(ev){
    if(!moving&&Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>8){moving=true;ghost=chip.cloneNode(true);ghost.classList.add("drag");document.body.appendChild(ghost);chip.style.opacity=.35}
    if(moving){ghost.style.left=ev.clientX-ghost.offsetWidth/2+"px";ghost.style.top=ev.clientY-ghost.offsetHeight/2+"px";
      document.querySelectorAll(".gap.over").forEach(function(x){x.classList.remove("over")});
      var t=hit(ev);if(t)t.classList.add("over")}
  }
  function up(ev){
    document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up);
    if(moving){chip.dataset.moved="1";setTimeout(function(){delete chip.dataset.moved},50);
      var t=hit(ev);ghost.remove();chip.style.opacity="";
      document.querySelectorAll(".gap.over").forEach(function(x){x.classList.remove("over")});
      if(t)place(chip,t)}
  }
  document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up);
}
function hit(ev){var gs=document.querySelectorAll(".gap"),best=null,bd=1e9;
  for(var i=0;i<gs.length;i++){var r=gs[i].getBoundingClientRect(),cx=(r.left+r.right)/2,cy=(r.top+r.bottom)/2,d=Math.hypot(ev.clientX-cx,ev.clientY-cy);
    if(d<bd&&d<90){bd=d;best=gs[i]}}return best}
document.getElementById("reset").onclick=build;
build();
</script>
</body>
</html>
