<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Say It!</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff7e6;--fg:#2b2b2b;--card:#fff;--ac:#ff7a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#24201a;--fg:#f4efe6;--card:#3a342a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS",Arial,sans-serif;text-align:center;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:2.4rem;margin:8px 0;color:var(--ac)}
.hearts{font-size:2rem;min-height:2.4rem}
.stage{background:var(--card);border-radius:24px;min-height:260px;display:flex;align-items:center;justify-content:center;flex-direction:column;margin:12px 0;box-shadow:0 4px 0 rgba(0,0,0,.12);padding:12px}
.big{font-size:8rem;line-height:1}
.big img,.opt img{max-width:100%;max-height:200px;border-radius:12px}
.word{font-size:2.2rem;font-weight:bold;min-height:2.8rem}
.msg{font-size:1.6rem;font-weight:bold;margin:6px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;background:var(--ac);color:#fff;font-size:1.4rem;padding:12px 24px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.opt{background:var(--card);color:var(--fg);min-height:130px;font-size:4rem;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:8px}
.opt small{font-size:1.1rem}
.opt.used{opacity:.35}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.95rem}
.slots label{background:var(--card);border-radius:12px;padding:8px;cursor:pointer}
details{margin:12px 0;text-align:left}
.dots{font-size:1.5rem;letter-spacing:4px}
.hide{display:none}
</style></head>
<body><main>
<h1>Say It! 🗣️</h1>
<div class="hearts" id="hearts"></div>
<div class="dots" id="dots"></div>
<div class="stage" id="stage"><div class="big">🪓🐜🍎🐊</div><div class="msg">ax · ant · apple · alligator</div></div>
<div class="msg" id="msg"></div>
<div class="grid hide" id="grid"></div>
<button id="go">▶ Играть / Play</button>
<p style="font-size:.9rem;opacity:.8">Как играть: нажимай на карточку, чтобы увидеть следующую, и запоминай порядок. Потом нажимай картинки в том же порядке и говори слова вслух!</p>
</main>
<script>
// ВСТАВЬТЕ СВОИ КАРТИНКИ СЮДА (порядок: ax, ant, apple, alligator).
// Можно путь к файлу ('ax.png') или data:image/... base64. Пустая строка = смайлик.
const IMAGES=['/English-T/students/Mark/games/say-it/Снимок1.PNG','students/Mark/games/say-it/2.PNG','/English-T/students/Mark/games/say-it/Снимок.PNG','/English-T/students/Mark/games/say-it/Снимок.PNG','/English-T/students/Mark/games/say-it/3.PNG'];
const W=['ax','ant','apple','alligator'],E=['🪓','🐜','🍎','🐊'],imgs=IMAGES;
const R=[{n:3,ms:1800,say:1},{n:4,ms:1400,say:1},{n:4,ms:1000},{n:4,ms:700},{n:4,ms:450}];
let round=0,lives=3,seq=[],prev='',pos=0,busy=false;
const $=id=>document.getElementById(id);
const sleep=t=>new Promise(r=>setTimeout(r,t));
function art(i){return imgs[i]?'<img src="'+imgs[i]+'" alt="'+W[i]+'">':E[i]}
function say(){}
function hud(){$('hearts').textContent='🧍'.repeat(0)+'❤️'.repeat(lives)+'🖤'.repeat(3-lives);
 $('dots').textContent=R.map((_,i)=>i<round?'⭐':i==round?'🔸':'▫️').join('')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newSeq(c){let s;do{s=shuffle([0,1,2,3]).slice(0,c.n)}while(s.join()==prev);prev=s.join();return s}
async function play(repeat){
 busy=true;$('go').classList.add('hide');$('grid').classList.add('hide');
 const c=R[round];if(!repeat)seq=newSeq(c);hud();
 const st=$('stage');st.style.cursor='pointer';
 for(let k=0;k<seq.length;k++){
  const i=seq[k];
  $('msg').textContent='👀 Смотри! Нажми на карточку 👆 ('+(k+1)+'/'+seq.length+')';
  st.innerHTML='<div class="big">'+art(i)+'</div><div class="word">'+(c.say?W[i]:'')+'</div>';
  if(c.say)say(W[i]);
  await new Promise(r=>{st.onclick=()=>{st.onclick=null;r()}});
 }
 st.style.cursor='';
 pos=0;$('msg').textContent='🗣️ Твоя очередь! Your turn!';
 $('stage').innerHTML='<div class="big">❔</div><div class="word"></div>';
 const g=$('grid');g.innerHTML='';
 shuffle([0,1,2,3]).forEach(i=>{const b=document.createElement('button');b.className='opt';b.innerHTML=art(i)+'<small>'+(c.say?W[i]:'')+'</small>';b.onclick=()=>pick(i,b);g.appendChild(b)});
 g.classList.remove('hide');busy=false;
}
async function pick(i,b){
 if(busy||b.classList.contains('used'))return;
 if(i==seq[pos]){
  say(W[i]);b.classList.add('used');pos++;
  if(pos==seq.length){busy=true;round++;hud();
   if(round>=R.length){win();return}
   $('msg').textContent='🎉 Отлично! Great!';await sleep(1300);play(false)}
 }else{
  busy=true;lives--;hud();$('msg').textContent='Ой! Oops! Ещё раз 💪';
  await sleep(1300);
  if(lives<=0){over();return}
  play(true)
 }
}
function win(){$('grid').classList.add('hide');$('stage').innerHTML='<div class="big">🏆</div><div class="word">You did it!</div>';
 $('msg').textContent='Ты молодец! Победа! 🎉';say('You did it! Great job!');reset()}
function over(){$('grid').classList.add('hide');$('stage').innerHTML='<div class="big">😴</div><div class="word">Try again!</div>';
 $('msg').textContent='Жизни закончились. Попробуем снова?';reset()}
function reset(){round=0;lives=3;prev='';busy=false;$('go').textContent='▶ Ещё раз / Again';$('go').classList.remove('hide')}
$('go').onclick=()=>{round=0;lives=3;prev='';play(false)};
hud();
</script></body></html>
