<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Listen and point to the colors</title>
<style>
  :root{
    --green:#3aa9a0;
    --green-dark:#0f9b8e;
    --yellow:#ffcc33;
    --ink:#20303a;
    --card-bg:#ffffff;
    --shadow: 0 10px 30px rgba(0,0,0,0.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --card-bg:#1c2126;
      --ink:#eef2f4;
    }
  }
  :root[data-theme="dark"]{
    --card-bg:#1c2126;
    --ink:#eef2f4;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background: linear-gradient(180deg,#fff7ea,#fff1de 40%,#fff7ea);
    font-family: 'Baloo 2','Trebuchet MS',system-ui,-apple-system,sans-serif;
    color:var(--ink);
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
    min-height:100%;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) body{
      background: linear-gradient(180deg,#12181c,#0d1215 40%,#12181c);
    }
  }
  :root[data-theme="dark"] body{
    background: linear-gradient(180deg,#12181c,#0d1215 40%,#12181c);
  }

  .wrap{
    max-width: 940px;
    margin: 0 auto;
    padding: 18px 16px 40px;
  }

  .card{
    background: var(--card-bg);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 18px 18px 22px;
  }

  .topbar{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .badge-num{
    width:38px;height:38px;border-radius:50%;
    background:#f0a428;color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;flex:0 0 auto;
    box-shadow: 0 3px 0 rgba(0,0,0,0.12);
  }
  .listen-btn{
    display:flex;align-items:center;gap:6px;
    background:var(--yellow);
    border:none;
    border-radius:999px;
    padding:6px 14px 6px 10px;
    font-weight:800;
    font-size:14px;
    color:#5a4200;
    cursor:pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.12);
    transition: transform .12s ease;
  }
  .listen-btn:active{ transform: scale(0.95); }
  .listen-btn svg{width:18px;height:18px;flex:0 0 auto;}
  .instruction{
    font-weight:800;
    font-size: clamp(16px,3.4vw,22px);
    color:var(--ink);
  }
  .progress-pill{
    margin-left:auto;
    background: rgba(58,169,160,0.14);
    color: var(--green-dark);
    font-weight:800;
    font-size:13px;
    padding:6px 12px;
    border-radius:999px;
    white-space:nowrap;
  }

  .stage{
    position:relative;
    border-radius:16px;
    overflow:hidden;
    line-height:0;
    user-select:none;
    -webkit-user-select:none;
    background: transparent;
  }
  .stage img{
    display:block;
    width:100%;
    height:auto;
    pointer-events:none;
    -webkit-user-drag:none;
  }

  .hotspot{
    position:absolute;
    cursor:pointer;
    outline:none;
    -webkit-tap-highlight-color: transparent;
  }
  .hotspot .ring{
    position:absolute;
    inset:0;
    border-radius:50% / 45%;
    border:3px solid transparent;
    transition: border-color .18s ease, background .18s ease, transform .18s ease;
  }
  .hotspot:hover .ring{
    border-color: rgba(58,169,160,0.75);
    background: rgba(58,169,160,0.08);
  }
  .hotspot.found .ring{
    border-color: rgba(46,204,113,0.95);
    background: rgba(46,204,113,0.10);
  }
  .hotspot.pulse .ring{
    animation: pulse 0.6s ease;
  }
  @keyframes pulse{
    0%{ transform: scale(1); }
    35%{ transform: scale(1.06); }
    100%{ transform: scale(1); }
  }

  .check{
    position:absolute;
    top:-6px; left:50%;
    transform: translateX(-50%) scale(0);
    width:26px;height:26px;
    border-radius:50%;
    background:#2ecc71;
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
    font-weight:900;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    transition: transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .hotspot.found .check{
    transform: translateX(-50%) scale(1);
  }

  .bubble{
    position:absolute;
    left:50%;
    top:-14px;
    transform: translate(-50%,-100%) scale(0.85);
    background:#fff;
    color:#20303a;
    font-weight:800;
    font-size:14px;
    padding:6px 12px;
    border-radius:12px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition: opacity .18s ease, transform .18s ease;
  }
  .bubble::after{
    content:"";
    position:absolute;
    left:50%; bottom:-6px;
    transform: translateX(-50%);
    border-width:6px 6px 0 6px;
    border-style:solid;
    border-color:#fff transparent transparent transparent;
  }
  .hotspot.show-bubble .bubble{
    opacity:1;
    transform: translate(-50%,-100%) scale(1);
  }

  .footer-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .hint{
    font-size:13px;
    color: color-mix(in srgb, var(--ink) 60%, transparent);
  }
  .footer-btns{
    display:flex;
    gap:8px;
    margin-left:auto;
  }
  .reset-btn{
    border:none;
    background: rgba(58,169,160,0.14);
    color: var(--green-dark);
    font-weight:800;
    font-size:13px;
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
  }
  .reset-btn:active{ transform: scale(0.96); }
  .reset-btn.ghost{
    background: transparent;
    border: 1.5px solid rgba(58,169,160,0.4);
  }

  .confetti-msg{
    text-align:center;
    font-weight:800;
    color: var(--green-dark);
    font-size:15px;
    margin-top:10px;
    opacity:0;
    transition: opacity .3s ease;
  }
  .confetti-msg.show{ opacity:1; }

  .sounds-panel{
    margin-top: 14px;
    border-radius: 16px;
    background: color-mix(in srgb, var(--green) 8%, transparent);
    border: 1.5px solid rgba(58,169,160,0.25);
    padding: 14px;
    display: none;
  }
  .sounds-panel.open{ display:block; }
  .sounds-panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .sounds-title{
    font-weight:800;
    font-size:15px;
  }
  .panel-close{
    border:none;
    background: rgba(0,0,0,0.06);
    width:26px;height:26px;
    border-radius:50%;
    cursor:pointer;
    font-size:13px;
    line-height:1;
    color: var(--ink);
  }
  .sounds-desc{
    font-size:12.5px;
    color: color-mix(in srgb, var(--ink) 62%, transparent);
    margin: 8px 0 12px;
    line-height:1.4;
  }
  .sounds-list{
    display:flex;
    flex-direction:column;
    gap:6px;
    max-height: 320px;
    overflow-y:auto;
  }
  .sound-row{
    display:flex;
    align-items:center;
    gap:10px;
    background: var(--card-bg);
    border-radius:10px;
    padding:8px 10px;
  }
  .sound-row .dot{
    width:20px;height:20px;
    border-radius:50%;
    flex:0 0 auto;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
  }
  .sound-row .word{
    font-weight:700;
    font-size:13.5px;
    width:64px;
    flex:0 0 auto;
    text-transform:capitalize;
  }
  .sound-row .status{
    flex:1 1 auto;
    font-size:12px;
    color: color-mix(in srgb, var(--ink) 55%, transparent);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .sound-row .status.has-audio{
    color: var(--green-dark);
    font-weight:700;
  }
  .row-btn{
    border:none;
    background: rgba(58,169,160,0.14);
    color: var(--green-dark);
    font-weight:700;
    font-size:12px;
    padding:5px 10px;
    border-radius:999px;
    cursor:pointer;
    flex:0 0 auto;
  }
  .row-btn.play{ background: rgba(255,204,51,0.25); color:#5a4200; }
  .row-btn.remove{ background: rgba(231,76,60,0.14); color:#c0392b; }
</style>
</head>

      </div>

      <div class="footer-row">
        <span class="hint">Нажимайте на шарики по очереди и слушайте названия цветов.</span>
        <button class="reset-btn" id="resetBtn">Сбросить</button>
      </div>
      <div class="confetti-msg" id="doneMsg">🎉 Отлично! Ты нашёл все цвета!</div>
    </div>
  </div>

<script>
  // color -> {word, left%, top%, right%, bottom%, hex} — boxes measured from the source image
  const items = [
    {word:"yellow", left:1.46,  top:31.54, right:15.59, bottom:99.00, hex:"#e8cf2a"},
    {word:"red",    left:17.15, top:8.92,  right:30.94, bottom:73.79, hex:"#c0392b"},
    {word:"orange", left:32.52, top:29.02, right:46.30, bottom:95.19, hex:"#e08a28"},
    {word:"purple", left:50.33, top:8.25,  right:64.20, bottom:74.74, hex:"#6c4f96"},
    {word:"green",  left:67.38, top:30.85, right:81.17, bottom:95.08, hex:"#4a9e4d"},
    {word:"blue",   left:84.04, top:11.04, right:97.91, bottom:73.98, hex:"#2f9bc9"}
  ];

  const stage = document.getElementById('stage');
  const progressPill = document.getElementById('progressPill');
  const doneMsg = document.getElementById('doneMsg');
  const found = new Set();

  // ============================================================
  // ВСТАВЬТЕ СВОИ ЗВУКИ ЗДЕСЬ
  // Укажите ссылку (URL) или путь к файлу для любого цвета.
  // Можно использовать:
  //   - ссылку в интернете:       yellow: 'https://example.com/yellow.mp3',
  //   - файл рядом с этим html:   yellow: 'sounds/yellow.mp3',
  // Если оставить пустую строку '', будет использована
  // стандартная озвучка браузером (Text-to-Speech).
  // ============================================================
  const customAudio = {
    yellow: '',
    red:    '',
    orange: '',
    purple: '',
    green:  '',
    blue:   ''
  };

  function speak(text){
    try{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function playWord(word){
    return new Promise((resolve)=>{
      const src = customAudio[word];
      if(src){
        try{
          const audio = new Audio(src);
          audio.addEventListener('ended', ()=> resolve());
          audio.addEventListener('error', ()=>{ speak(word); resolve(); });
          audio.play().catch(()=>{ speak(word); resolve(); });
        }catch(e){
          speak(word);
          resolve();
        }
      } else {
        speak(word);
        resolve();
      }
    });
  }

  function updateProgress(){
    progressPill.textContent = found.size + ' / ' + items.length;
    if(found.size === items.length){
      doneMsg.classList.add('show');
    } else {
      doneMsg.classList.remove('show');
    }
  }

  items.forEach(item => {
    const hs = document.createElement('div');
    hs.className = 'hotspot';
    hs.style.left = item.left + '%';
    hs.style.width = (item.right - item.left) + '%';
    hs.style.top = item.top + '%';
    hs.style.height = (item.bottom - item.top) + '%';
    hs.setAttribute('role','button');
    hs.setAttribute('aria-label', 'Balloon ' + item.word);
    hs.tabIndex = 0;

    const ring = document.createElement('div');
    ring.className = 'ring';
    hs.appendChild(ring);

    const check = document.createElement('div');
    check.className = 'check';
    check.textContent = '✓';
    hs.appendChild(check);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = item.word;
    hs.appendChild(bubble);

    let bubbleTimer = null;

    function activate(){
      playWord(item.word);
      found.add(item.word);
      hs.classList.add('found');
      hs.classList.remove('pulse');
      void hs.offsetWidth;
      hs.classList.add('pulse');
      hs.classList.add('show-bubble');
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(()=> hs.classList.remove('show-bubble'), 1400);
      updateProgress();
    }

    hs.addEventListener('click', activate);
    hs.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); activate(); }
    });

    stage.appendChild(hs);
  });

  document.getElementById('resetBtn').addEventListener('click', ()=>{
    found.clear();
    document.querySelectorAll('.hotspot').forEach(h=>{
      h.classList.remove('found','show-bubble','pulse');
    });
    updateProgress();
  });

  document.getElementById('playAllBtn').addEventListener('click', async ()=>{
    const hotspots = document.querySelectorAll('.hotspot');
    for(let i=0; i<items.length; i++){
      const item = items[i];
      const hs = hotspots[i];
      hs.classList.add('pulse','show-bubble');
      await playWord(item.word);
      hs.classList.remove('pulse','show-bubble');
      await new Promise(r=> setTimeout(r, customAudio[item.word] ? 150 : 550));
    }
  });

  updateProgress();
</script>
</body>
