<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Listen and match</title>
<style>
  :root{
    --green:#7cc242;
    --green-dark:#5a9e28;
    --blue:#29b6d8;
    --red:#e74c3c;
    --ink:#20303a;
    --card-bg:#ffffff;
    --shadow: 0 10px 30px rgba(0,0,0,0.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --card-bg:#1c2126; --ink:#eef2f4; }
  }
  :root[data-theme="dark"]{ --card-bg:#1c2126; --ink:#eef2f4; }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background: linear-gradient(180deg,#eef8ea,#e6f4e0 40%,#eef8ea);
    font-family: 'Baloo 2','Trebuchet MS',system-ui,-apple-system,sans-serif;
    color:var(--ink);
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
    min-height:100%;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) body{ background: linear-gradient(180deg,#12181c,#0d1215 40%,#12181c); }
  }
  :root[data-theme="dark"] body{ background: linear-gradient(180deg,#12181c,#0d1215 40%,#12181c); }

  .wrap{ max-width: 980px; margin: 0 auto; padding: 18px 16px 40px; }
  .card{ background: var(--card-bg); border-radius: 24px; box-shadow: var(--shadow); padding: 18px 18px 22px; }

  .topbar{ display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .badge-num{ width:38px;height:38px;border-radius:50%; background:var(--blue); color:#fff;
    display:flex;align-items:center;justify-content:center; font-weight:800;font-size:19px;flex:0 0 auto;
    box-shadow: 0 3px 0 rgba(0,0,0,0.12); }
  .listen-btn{ display:flex;align-items:center;gap:6px; background:var(--green);
    border:none; border-radius:999px; padding:6px 14px 6px 10px; font-weight:800; font-size:14px;
    color:#fff; cursor:pointer; box-shadow: 0 3px 0 rgba(0,0,0,0.12); transition: transform .12s ease; }
  .listen-btn:active{ transform: scale(0.95); }
  .listen-btn svg{width:18px;height:18px;flex:0 0 auto;}
  .instruction{ font-weight:800; font-size: clamp(16px,3.4vw,22px); color:var(--ink); }
  .progress-pill{ margin-left:auto; background: rgba(124,194,66,0.16); color: var(--green-dark);
    font-weight:800; font-size:13px; padding:6px 12px; border-radius:999px; white-space:nowrap; }

  .stage{ position:relative; border-radius:16px; overflow:hidden; line-height:0;
    user-select:none; -webkit-user-select:none; background: transparent; }
  .stage img{ display:block; width:100%; height:auto; pointer-events:none; -webkit-user-drag:none; }
  .lines-svg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  .hotspot{ position:absolute; cursor:pointer; outline:none; -webkit-tap-highlight-color: transparent; }
  .hotspot .ring{ position:absolute; inset:-4px; border-radius:18px; border:3px solid transparent;
    transition: border-color .18s ease, background .18s ease, transform .15s ease; }
  .hotspot:hover .ring{ border-color: rgba(41,182,216,0.6); background: rgba(41,182,216,0.06); }
  .hotspot.selected .ring{ border-color: #f0a428; background: rgba(240,164,40,0.12); }
  .hotspot.matched .ring{ border-color: rgba(46,204,113,0.95); background: rgba(46,204,113,0.10); }
  .hotspot.matched{ cursor:default; }
  .hotspot.wrong .ring{ border-color: var(--red); background: rgba(231,76,60,0.12); }
  .hotspot.shake{ animation: shake .4s ease; }
  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-6px); }
    40%{ transform: translateX(6px); }
    60%{ transform: translateX(-4px); }
    80%{ transform: translateX(4px); }
  }
  .hotspot.pulse .ring{ animation: pulse 0.5s ease; }
  @keyframes pulse{
    0%{ transform: scale(1); }
    35%{ transform: scale(1.05); }
    100%{ transform: scale(1); }
  }
  .check{ position:absolute; top:-10px; right:-10px; transform: scale(0);
    width:26px;height:26px; border-radius:50%; background:#2ecc71; color:#fff;
    display:flex;align-items:center;justify-content:center; font-size:15px; font-weight:900;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25); transition: transform .25s cubic-bezier(.34,1.56,.64,1); z-index:2; }
  .hotspot.matched .check{ transform: scale(1); }

  .footer-row{ display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:16px; flex-wrap:wrap; }
  .hint{ font-size:13px; color: color-mix(in srgb, var(--ink) 60%, transparent); }
  .footer-btns{ display:flex; gap:8px; margin-left:auto; }
  .reset-btn{ border:none; background: rgba(124,194,66,0.16); color: var(--green-dark);
    font-weight:800; font-size:13px; padding:8px 16px; border-radius:999px; cursor:pointer; }
  .reset-btn:active{ transform: scale(0.96); }
  .reset-btn.ghost{ background: transparent; border: 1.5px solid rgba(124,194,66,0.45); }

  .confetti-msg{ text-align:center; font-weight:800; color: var(--green-dark); font-size:15px;
    margin-top:10px; opacity:0; transition: opacity .3s ease; }
  .confetti-msg.show{ opacity:1; }

  .sounds-panel{ margin-top: 14px; border-radius: 16px; background: color-mix(in srgb, var(--green) 10%, transparent);
    border: 1.5px solid rgba(124,194,66,0.3); padding: 14px; display: none; }
  .sounds-panel.open{ display:block; }
  .sounds-panel-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .sounds-title{ font-weight:800; font-size:15px; }
  .panel-close{ border:none; background: rgba(0,0,0,0.06); width:26px;height:26px; border-radius:50%;
    cursor:pointer; font-size:13px; line-height:1; color: var(--ink); }
  .sounds-desc{ font-size:12.5px; color: color-mix(in srgb, var(--ink) 62%, transparent);
    margin: 8px 0 12px; line-height:1.4; }
  .sounds-group-title{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.03em;
    color: color-mix(in srgb, var(--ink) 55%, transparent); margin: 10px 0 6px; }
  .sounds-list{ display:flex; flex-direction:column; gap:6px; max-height: 340px; overflow-y:auto; }
  .sound-row{ display:flex; align-items:center; gap:10px; background: var(--card-bg); border-radius:10px; padding:8px 10px; }
  .sound-row .num{ width:26px;height:26px; border-radius:50%; background: var(--blue); color:#fff;
    font-weight:800; font-size:13px; display:flex;align-items:center;justify-content:center; flex:0 0 auto; }
  .sound-row .num.letter{ background: var(--green); text-transform:uppercase; }
  .sound-row .status{ flex:1 1 auto; font-size:12px; color: color-mix(in srgb, var(--ink) 55%, transparent);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sound-row .status.has-audio{ color: var(--green-dark); font-weight:700; }
  .row-btn{ border:none; background: rgba(124,194,66,0.16); color: var(--green-dark); font-weight:700;
    font-size:12px; padding:5px 10px; border-radius:999px; cursor:pointer; flex:0 0 auto; }
  .row-btn.play{ background: rgba(41,182,216,0.18); color:#0b7c94; }
  .row-btn.remove{ background: rgba(231,76,60,0.14); color:#c0392b; }
</style>
</head>

  </div>

<script>
  // boxes measured from the source image, in percent
  const kids = [
    {id:'1', left:6.55,  top:9.32,  right:22.62, bottom:36.06},
    {id:'2', left:30.62, top:28.48, right:47.60, bottom:56.97},
    {id:'3', left:5.56,  top:52.79, right:28.10, bottom:79.62},
    {id:'4', left:29.86, top:73.69, right:49.05, bottom:99.30}
  ];
  const bags = [
    {id:'a', left:78.90, top:10.37, right:93.45, bottom:29.79},
    {id:'b', left:78.90, top:32.23, right:93.45, bottom:51.66},
    {id:'c', left:78.90, top:54.01, right:93.53, bottom:73.43},
    {id:'d', left:78.90, top:75.78, right:93.45, bottom:95.21}
  ];
  const correctMatch = {'1':'c','2':'a','3':'d','4':'b'};

  const stage = document.getElementById('stage');
  const linesSvg = document.getElementById('linesSvg');
  const progressPill = document.getElementById('progressPill');
  const doneMsg = document.getElementById('doneMsg');

  const matched = {}; // kidId -> bagId
  let selected = null; // {type:'kid'|'bag', id}
  const kidEls = {};
  const bagEls = {};

  // ============================================================
  // ВСТАВЬТЕ СВОИ ЗВУКИ ЗДЕСЬ
  // Укажите ссылку (URL) или путь к файлу для детей (1–4)
  // и/или для рюкзаков (a–d). Можно использовать:
  //   - ссылку в интернете:      1: 'https://example.com/kid1.mp3',
  //   - файл рядом с этим html:  1: 'sounds/kid1.mp3',
  // Если оставить пустую строку '', будет использована
  // стандартная озвучка браузером (Text-to-Speech).
  // ============================================================
  const customAudio = {
    1: '',
    2: '',
    3: '',
    4: '',
    a: '',
    b: '',
    c: '',
    d: ''
  };

  function speak(text){
    try{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function fallbackText(type, id){
    if(type === 'kid') return 'Number ' + id;
    return 'Letter ' + id.toUpperCase();
  }

  function playItem(type, id){
    return new Promise((resolve)=>{
      const src = customAudio[id];
      const fb = fallbackText(type, id);
      if(src){
        try{
          const audio = new Audio(src);
          audio.addEventListener('ended', ()=> resolve());
          audio.addEventListener('error', ()=>{ speak(fb); resolve(); });
          audio.play().catch(()=>{ speak(fb); resolve(); });
        }catch(e){ speak(fb); resolve(); }
      } else {
        speak(fb);
        resolve();
      }
    });
  }

  function updateProgress(){
    const n = Object.keys(matched).length;
    progressPill.textContent = n + ' / 4';
    if(n === 4) doneMsg.classList.add('show');
    else doneMsg.classList.remove('show');
  }

  function centerOf(box){
    return { x:(box.left+box.right)/2, y:(box.top+box.bottom)/2 };
  }

  function drawLine(kidId, bagId, ok){
    const kbox = kids.find(k=>k.id===kidId);
    const bbox = bags.find(b=>b.id===bagId);
    const x1 = kbox.right, y1 = (kbox.top+kbox.bottom)/2;
    const x2 = bbox.left, y2 = (bbox.top+bbox.bottom)/2;
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', x1*10);
    line.setAttribute('y1', y1*10);
    line.setAttribute('x2', x2*10);
    line.setAttribute('y2', y2*10);
    line.setAttribute('stroke', ok ? '#2ecc71' : '#e74c3c');
    line.setAttribute('stroke-width', '5');
    line.setAttribute('stroke-linecap', 'round');
    if(!ok){
      line.style.opacity = '0.85';
    }
    linesSvg.appendChild(line);
    return line;
  }

  function makeHotspot(box, type){
    const hs = document.createElement('div');
    hs.className = 'hotspot';
    hs.style.left = box.left + '%';
    hs.style.top = box.top + '%';
    hs.style.width = (box.right-box.left) + '%';
    hs.style.height = (box.bottom-box.top) + '%';
    hs.setAttribute('role','button');
    hs.setAttribute('aria-label', (type==='kid' ? 'Child ' : 'Backpack ') + box.id);
    hs.tabIndex = 0;

    const ring = document.createElement('div');
    ring.className = 'ring';
    hs.appendChild(ring);

    const check = document.createElement('div');
    check.className = 'check';
    check.textContent = '✓';
    hs.appendChild(check);

    function activate(){
      if(hs.classList.contains('matched')) return;
      playItem(type, box.id);
      hs.classList.remove('pulse');
      void hs.offsetWidth;
      hs.classList.add('pulse');

      if(!selected){
        selected = {type, id:box.id};
        hs.classList.add('selected');
        return;
      }
      if(selected.type === type){
        // switch selection within same column
        const prevEl = type==='kid' ? kidEls[selected.id] : bagEls[selected.id];
        if(prevEl) prevEl.classList.remove('selected');
        if(selected.id === box.id){
          selected = null;
          return;
        }
        selected = {type, id:box.id};
        hs.classList.add('selected');
        return;
      }
      // different type selected -> attempt match
      const kidId = type==='kid' ? box.id : selected.id;
      const bagId = type==='bag' ? box.id : selected.id;
      const kidEl = kidEls[kidId];
      const bagEl = bagEls[bagId];
      const ok = correctMatch[kidId] === bagId;

      kidEl.classList.remove('selected');
      bagEl.classList.remove('selected');
      selected = null;

      if(ok){
        matched[kidId] = bagId;
        kidEl.classList.add('matched');
        bagEl.classList.add('matched');
        drawLine(kidId, bagId, true);
        updateProgress();
      } else {
        kidEl.classList.add('wrong','shake');
        bagEl.classList.add('wrong','shake');
        const badLine = drawLine(kidId, bagId, false);
        setTimeout(()=>{
          kidEl.classList.remove('wrong','shake');
          bagEl.classList.remove('wrong','shake');
          badLine.remove();
        }, 650);
      }
    }

    hs.addEventListener('click', activate);
    hs.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); activate(); }
    });

    stage.appendChild(hs);
    return hs;
  }

  kids.forEach(k=> kidEls[k.id] = makeHotspot(k,'kid'));
  bags.forEach(b=> bagEls[b.id] = makeHotspot(b,'bag'));

  document.getElementById('resetBtn').addEventListener('click', ()=>{
    Object.keys(matched).forEach(k=> delete matched[k]);
    selected = null;
    Object.values(kidEls).forEach(el=> el.classList.remove('matched','selected','wrong','shake','pulse'));
    Object.values(bagEls).forEach(el=> el.classList.remove('matched','selected','wrong','shake','pulse'));
    linesSvg.innerHTML = '';
    updateProgress();
  });

  document.getElementById('playAllBtn').addEventListener('click', async ()=>{
    for(const k of kids){
      kidEls[k.id].classList.add('pulse');
      await playItem('kid', k.id);
      kidEls[k.id].classList.remove('pulse');
      await new Promise(r=> setTimeout(r, customAudio[k.id] ? 150 : 500));
    }
  });

  updateProgress();
</script>
</body>
</html>
