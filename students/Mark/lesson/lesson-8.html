<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Trial Lesson for Kids</title>
<style>
:root{--primary:#4CAF50;--bg-color:#f0f8ff;--card-bg:#fff;--text-color:#333}
*{box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg-color);color:var(--text-color);margin:0;padding:20px;display:flex;flex-direction:column;align-items:center;user-select:none}

/* Tabs */
.navigation{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.nav-btn{background:#ddd;border:none;padding:10px 20px;border-radius:20px;cursor:pointer;font-weight:bold;font-size:1rem;transition:all .3s ease}
.nav-btn.active{background:var(--primary);color:#fff;box-shadow:0 4px 10px rgba(76,175,80,.3)}
.nav-btn:focus-visible{outline:3px solid #ff9800;outline-offset:2px}

/* Slides */
.slide-container{background:var(--card-bg);border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,.1);padding:30px;width:90%;max-width:800px;min-height:450px;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.slide-container.active{display:flex}
h1{font-size:2.5rem;margin-top:0;color:#2c3e50}
p{font-size:1.5rem;color:#7f8c8d}

/* Slide with picture + players */
.hello-content{display:flex;align-items:center;justify-content:center;gap:35px;width:100%}
.hello-character{width:420px;height:420px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 5px 10px rgba(0,0,0,.15))}
.lesson-img{display:block;width:100%;height:auto;border-radius:12px}
.reveal-block{display:flex;flex-direction:column;gap:12px;width:100%;max-width:500px}
.reveal-card{display:flex;align-items:center;gap:12px;background:#e3f2fd;border-radius:16px;padding:14px 18px;width:100%}
.reveal-play-btn{flex-shrink:0;width:46px;height:46px;border-radius:50%;border:none;background:#1565c0;color:#fff;font-size:1.2rem;cursor:pointer;transition:transform .15s ease}
.reveal-play-btn:active{transform:scale(.9)}
.reveal-play-btn:disabled{opacity:.6;cursor:default}
.reveal-text{flex:1;font-size:1.4rem;font-weight:bold;color:#1565c0;text-align:left;min-height:1.8em}
.reveal-word{display:inline-block;opacity:0;transform:translateY(8px);transition:opacity .35s ease,transform .35s ease}
.reveal-word.shown{opacity:1;transform:none}
.reveal-card.answer{background:#e8f5e9}
.reveal-card.answer .reveal-play-btn{background:#2e7d32}
.reveal-card.answer .reveal-text{color:#2e7d32}

/* Game slide: full width of the container */
.slide-container.game-slide{padding:0;width:100%;max-width:100%;min-height:0;background:transparent;box-shadow:none}
.game-frame{display:block;width:100%;height:clamp(450px,85vh,850px);border:0;border-radius:20px;background:#fff}

@media (max-width:900px){
  .hello-content{flex-direction:column;gap:20px}
  .hello-character{width:320px;height:320px}
  .reveal-block{max-width:600px}
}
@media (max-width:600px){
  body{padding:10px}
  .slide-container{width:95%;padding:20px}
  .slide-container.game-slide{width:100%;padding:0}
  .game-frame{height:80vh;min-height:400px;border-radius:12px}
  .hello-character{width:260px;height:260px}
  h1{font-size:2rem}
  p{font-size:1.2rem}
  .reveal-text{font-size:1.1rem}
  .reveal-play-btn{width:42px;height:42px}
}
</style>
</head>
<body>

<div class="navigation" role="tablist">
  <button class="nav-btn active" role="tab" aria-selected="true" onclick="switchSlide(1,this)">1. Listen and Stick</button>
  <button class="nav-btn" role="tab" aria-selected="false" onclick="switchSlide(2,this)">2. Repeat after me</button>
  <button class="nav-btn" role="tab" aria-selected="false" onclick="switchSlide(3,this)">3. TPR Game</button>
</div>

<!-- Slide 1 -->
<div id="slide1" class="slide-container active">
  <div class="hello-content">
    <img class="lesson-img" src="/English-T/images/Снимок.PNG" alt="Listen and stick">
  </div>
</div>

<!-- Slide 2 -->
<div id="slide2" class="slide-container">
  <div class="hello-content">
    <img src="/English-T/images/character-ask.png" alt="Mascot" id="main-character-img" class="hello-character">

    <div class="reveal-block">
      <div class="reveal-card" data-audio="/English-T/sound/please/Pass me a notebook.mp3">
        <button class="reveal-play-btn" onclick="revealQuestion(this)">▶️</button>
        <div class="reveal-text" data-text="Pass me a notebook"></div>
      </div>
      <div class="reveal-card answer" data-audio="/English-T/sound/please/Pass me a notebook, please.mp3">
        <button class="reveal-play-btn" onclick="revealQuestion(this)">▶️</button>
        <div class="reveal-text" data-text="Pass me a notebook, please"></div>
      </div>
      <div class="reveal-card" data-audio="/English-T/sound/please/Pass me a pen.mp3">
        <button class="reveal-play-btn" onclick="revealQuestion(this)">▶️</button>
        <div class="reveal-text" data-text="Pass me a pen"></div>
      </div>
      <div class="reveal-card answer" data-audio="/English-T/sound/please/Pass me a pen please.mp3">
        <button class="reveal-play-btn" onclick="revealQuestion(this)">▶️</button>
        <div class="reveal-text" data-text="Pass me a pen, please"></div>
      </div>
      <div class="reveal-card" data-audio="/English-T/sound/please/Pass me a pencil.mp3">
        <button class="reveal-play-btn" onclick="revealQuestion(this)">▶️</button>
        <div class="reveal-text" data-text="Pass me a pencil"></div>
      </div>
      <div class="reveal-card answer" data-audio="/English-T/sound/please/Pass me a pencil, please.mp3">
        <button class="reveal-play-btn" onclick="revealQuestion(this)">▶️</button>
        <div class="reveal-text" data-text="Pass me a pencil, please"></div>
      </div>
      <div class="reveal-card" data-audio="/English-T/sound/please/sit at your desk.mp3">
        <button class="reveal-play-btn" onclick="revealQuestion(this)">▶️</button>
        <div class="reveal-text" data-text="Sit at your desk"></div>
      </div>
      <div class="reveal-card answer" data-audio="/English-T/sound/please/Sit at your desk, please.mp3">
        <button class="reveal-play-btn" onclick="revealQuestion(this)">▶️</button>
        <div class="reveal-text" data-text="Sit at your desk, please"></div>
      </div>
    </div>
  </div>
</div>

<!-- Slide 3 -->
<div id="slide3" class="slide-container game-slide">
  <iframe class="game-frame" src="/English-T/students/Mark/games/Listen and stick_ classroom words.html" title="Game" allowfullscreen></iframe>
</div>

<script>
/* Tabs */
function switchSlide(num, btn) {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  document.querySelectorAll('.slide-container').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
  document.getElementById('slide' + num).classList.add('active');
  if (btn) { btn.classList.add('active'); btn.setAttribute('aria-selected', 'true'); }
}

/* Reveal speed */
const REVEAL_SPEEDS = { slow:{rate:0.65,interval:550}, normal:{rate:0.85,interval:380}, fast:{rate:1.15,interval:230} };
let currentRevealSpeed = 'normal';

function revealQuestion(btn) {
  const card = btn.closest('.reveal-card');
  const textEl = card.querySelector('.reveal-text');
  const fullText = textEl.dataset.text;
  const audioSrc = (card.dataset.audio || '').trim();
  const speed = REVEAL_SPEEDS[currentRevealSpeed];
  const mascot = document.getElementById('main-character-img');
  if (mascot) mascot.src = card.classList.contains('answer')
    ? '/English-T/images/character-react.png' : '/English-T/images/character-ask.png';

  textEl.innerHTML = fullText.split(' ').map(w => `<span class="reveal-word">${w}</span>`).join(' ');
  const wordEls = textEl.querySelectorAll('.reveal-word');
  const showAll = () => { wordEls.forEach(w => w.classList.add('shown')); btn.disabled = false; };
  btn.disabled = true;

  if (audioSrc) {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    const audio = new Audio(audioSrc);
    audio.onended = () => { btn.disabled = false; };
    audio.onerror = showAll;
    audio.play().catch(showAll);
    revealByTimer(wordEls, btn, speed.interval, false);
    return;
  }

  if (!('speechSynthesis' in window)) { revealByTimer(wordEls, btn, speed.interval); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(fullText);
  utter.lang = 'en-US';
  utter.rate = speed.rate;
  let i = 0, boundary = false;
  utter.onboundary = e => {
    if (e.name === 'word' && i < wordEls.length) { boundary = true; wordEls[i++].classList.add('shown'); }
  };
  utter.onend = showAll;
  utter.onerror = showAll;
  window.speechSynthesis.speak(utter);
  setTimeout(() => { if (!boundary) revealByTimer(wordEls, btn, speed.interval); }, 350);
}

function revealByTimer(wordEls, btn, interval, manageButton = true) {
  let i = 0;
  const timer = setInterval(() => {
    if (i >= wordEls.length) { clearInterval(timer); if (manageButton) btn.disabled = false; return; }
    wordEls[i++].classList.add('shown');
  }, interval);
}
</script>
</body>
</html>
