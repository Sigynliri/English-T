<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Trial Lesson for Kids</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #45a049;
            --bg-color: #f0f8ff;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        /* Навигация по этапам */
        .navigation {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-btn {
            background-color: #ddd;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .nav-btn.active {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }

        /* Контейнер для слайдов */
        .slide-container {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 30px;
            width: 90%;
            max-width: 800px;
            min-height: 450px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .slide-container.active {
            display: flex;
        }

        h1 { font-size: 2.5rem; margin-top: 0; color: #2c3e50; }
        p { font-size: 1.5rem; color: #7f8c8d; }

        /* Стили для карточек животных */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
            width: 100%;
        }

        .card {
            background: #f9f9f9;
            border: 4px solid #e0e0e0;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, opacity 0.6s ease, visibility 0.6s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: scale(1.03);
            border-color: var(--primary);
        }

        .card img {
            width: 100%;
            max-width: 200px;
            height: auto;
            object-fit: contain;
        }

        .card .word {
            font-size: 1.8rem;
            font-weight: bold;
            margin-top: 10px;
            color: #2c3e50;
        }

        /* Специальные анимации и кнопки */
        .btn-action {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
            font-weight: bold;
            transition: transform 0.2s;
        }

        .btn-action:hover { transform: scale(1.05); }

        .hidden-card {
            opacity: 0;
            transform: scale(0.85);
            visibility: hidden;
            transition: opacity 0.6s ease, transform 0.6s ease, visibility 0s linear 0.6s;
        }

        /* Анимация для заморозки (Freeze) */
        .freeze-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 188, 212, 0.8);
            color: white;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 5rem;
            font-weight: bold;
            z-index: 1000;
        }

        /* Общий стиль для всех слайдов-игр (полноразмерный iframe) */
        .slide-container.game-slide {
            padding: 0;
            width: 100%;
            max-width: 100%;
            min-height: 85vh;
        }

        .game-slide iframe {
            width: 100%;
            height: 85vh;
            border: none;
            border-radius: 20px;
            display: block;
        }

        /* Анимация появления вопросов слово за словом */
        .reveal-block {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 500px;
            margin: 10px auto;
        }

        .reveal-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #e3f2fd;
            border-radius: 16px;
            padding: 14px 18px;
        }

        .reveal-play-btn {
            flex-shrink: 0;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            background: #1565c0;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .reveal-play-btn:active { transform: scale(0.9); }

        .reveal-text {
            font-size: 1.4rem;
            font-weight: bold;
            color: #1565c0;
            text-align: left;
            min-height: 1.8em;
        }

        .reveal-word {
            display: inline-block;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .reveal-word.shown {
            opacity: 1;
            transform: translateY(0);
        }

        .reveal-card.answer {
            background: #e8f5e9;
        }

        .reveal-card.answer .reveal-play-btn {
            background: #2e7d32;
        }

        .reveal-card.answer .reveal-text {
            color: #2e7d32;
        }
    </style>
</head>
<body>

    <!-- НАВИГАЦИЯ: Теперь мы передаем 'this' (саму кнопку) внутрь функции -->
    <div class="navigation">
        <button class="nav-btn active" onclick="switchSlide(1, this)">1. Hello</button>
        <button class="nav-btn" onclick="switchSlide(2, this)">2. Animals</button>
        <button class="nav-btn" onclick="switchSlide(3, this)">3. TPR Game</button>
        <button class="nav-btn" onclick="switchSlide(4, this)">4. What's Missing?</button>
        <button class="nav-btn" onclick="switchSlide(5, this)">5. Hide and Seek!</button>
        <button class="nav-btn" onclick="switchSlide(6, this)">6. Feed the chameleon!</button>
    </div>

       <!-- СЛАЙД 1: Интерактивное приветствие со сменой эмоций -->
    <div id="slide1" class="slide-container active">
        <h1>Hello! 👋</h1>
        <p>Let's talk and sing together!</p>
        
        <!-- КАРТИНКА ПЕРСОНАЖА (по умолчанию стоит картинка вопроса) -->
        <img src="/English-T/images/character-ask.png" alt="Mascot" id="main-character-img" style="width: 600px; height: 600px; object-fit: contain; margin: 15px 0; filter: drop-shadow(0px 5px 10px rgba(0,0,0,0.15)); transition: transform 0.2s, filter 0.2s;">

        <div class="reveal-block">
            <div class="reveal-card" data-audio="/English-T/sound/what's your name.MP3">
                <button class="reveal-play-btn" onclick="revealQuestion(this)">▶️</button>
                <div class="reveal-text" data-text="What is your name?"></div>
            </div>
              <div class="reveal-card answer" data-audio="/English-T/sound/MyNameis.MP3">
                <button class="reveal-play-btn" onclick="revealQuestion(this)">▶️</button>
                <div class="reveal-text" data-text="My name is Mark"></div>
            </div>
            <div class="reveal-card" data-audio="/English-T/sound/How old.MP3">
                <button class="reveal-play-btn" onclick="revealQuestion(this)">▶️</button>
                <div class="reveal-text" data-text="How old are you?"></div>
            </div>
            <div class="reveal-card answer" data-audio="/English-T/sound/Iamsix.MP3">
                <button class="reveal-play-btn" onclick="revealQuestion(this)">▶️</button>
                <div class="reveal-text" data-text="I am six years old"></div>
            </div>
            <div class="reveal-card" data-audio="/English-T/sound/its nice.MP3">
                <button class="reveal-play-btn" onclick="revealQuestion(this)">▶️</button>
                <div class="reveal-text" data-text="It's nice to meet you!"></div>
            </div>
               <div class="reveal-card" data-audio="/English-T/sound/meet you too.MP3">
                <button class="reveal-play-btn" onclick="revealQuestion(this)">▶️</button>
                <div class="reveal-text" data-text="It's nice to meet you too!"></div>
            </div>
        </div>
    </div>


    <!-- СЛАЙД 2: Изучение слов -->
    <div id="slide2" class="slide-container">
        <h1>Listen and Repeat! 🐾</h1>
        <div class="grid">
            <div class="card" onclick="speak('Cat')">
                <img src="/English-T/images/cat.png" alt="cat">
                <div class="word">a cat</div>
            </div>
            <div class="card" onclick="speak('Dog')">
                <img src="/English-T/images/dog.png" alt="dog">
                <div class="word">a dog</div>
            </div>
            <div class="card" onclick="speak('Lion')">
                <img src="/English-T/images/lion.png" alt="lion">
                <div class="word">a lion</div>
            </div>
            <div class="card" onclick="speak('Frog')">
                <img src="/English-T/images/frog.png" alt="frog">
                <div class="word">a frog</div>
            </div>
        </div>
    </div>

    <!-- СЛАЙД 3: Физкультминутка -->
    <div id="slide3" class="slide-container">
        <div style="position: relative; width: 100%; padding-bottom: 56.25%; height: 0; margin: 15px 0; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">
            <iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" src="https://www.youtube.com/embed/wKXXT244yFI?si=H1sWprKCzk_Gx_ik" allowfullscreen></iframe>
        </div>
    </div>

    <!-- СЛАЙД 4: Игра "What's missing?" -->
    <div id="slide4" class="slide-container">
        <h1>What's Missing? 🤔</h1>
        <p>Закрой глаза, а учитель спрячет животное!</p>
        <button class="btn-action" style="background:#9c27b0; margin-bottom: 20px;" onclick="hideRandomCard()">🙈 Hide Animal</button>
        <div class="grid" id="missing-grid">
            <div class="card game-card" data-name="a cat">
                <img src="/English-T/images/cat.png" alt="cat">
                <div class="word">a cat</div>
            </div>
            <div class="card game-card" data-name="a dog">
                <img src="/English-T/images/dog.png" alt="dog">
                <div class="word">a dog</div>
            </div>
            <div class="card game-card" data-name="a lion">
                <img src="/English-T/images/lion.png" alt="lion">
                <div class="word">a lion</div>
            </div>
            <div class="card game-card" data-name="a frog">
                <img src="/English-T/images/frog.png" alt="frog">
                <div class="word">a frog</div>
            </div>
        </div>
    </div>

    <!-- СЛАЙД 5: Прятки -->
    <div id="slide5" class="slide-container game-slide">
        <iframe 
            src="hide-and-seek-garden.html" 
            title="Game"
            allowfullscreen>
        </iframe>
    </div>

    <!-- СЛАЙД 6: Хамелеон -->
    <div id="slide6" class="slide-container game-slide">
        <iframe 
            src="feed-the-chameleon.html" 
            title="Game"
            allowfullscreen>
        </iframe>
    </div>

    <script>
    function switchSlide(num, btn) {
        document.querySelectorAll('.slide-container').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('slide' + num).classList.add('active');
        if (btn) btn.classList.add('active');
    }

    function speak(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = 0.9;
        window.speechSynthesis.speak(u);
    }

    function mascotAction(text, type) {
        const img = document.getElementById('main-character-img');
        // type 1 = вопрос, type 2 = реакция — меняем картинку персонажа
        img.src = type === 1
            ? '/English-T/images/character-ask.png'
            : '/English-T/images/character-react.png';
        speak(text);
    }

    // Настройки скорости анимации вопросов
    const REVEAL_SPEEDS = {
        slow:   { rate: 0.65, interval: 550 },
        normal: { rate: 0.85, interval: 380 },
        fast:   { rate: 1.15, interval: 230 }
    };
    let currentRevealSpeed = 'normal';

    function setRevealSpeed(speed, btn) {
        currentRevealSpeed = speed;
        btn.parentElement.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    // Анимация появления вопроса слово за словом, синхронизированная со звуком
    function revealQuestion(btn) {
        const card = btn.closest('.reveal-card');
        const textEl = card.querySelector('.reveal-text');
        const fullText = textEl.dataset.text;
        const customAudioSrc = card.dataset.audio; // впишите путь к своему mp3, например data-audio="sounds/my-name-is-mark.mp3"
        const words = fullText.split(' ');
        const speedSettings = REVEAL_SPEEDS[currentRevealSpeed];

        // Переключаем картинку персонажа: вопрос — "спрашивающая" поза,
        // ответ (карточка с классом .answer) — "реагирующая" поза
        const isAnswer = card.classList.contains('answer');
        const mascotImg = document.getElementById('main-character-img');
        if (mascotImg) {
            mascotImg.src = isAnswer
                ? '/English-T/images/character-react.png'
                : '/English-T/images/character-ask.png';
        }

        // Рисуем слова заново, все скрытые
        textEl.innerHTML = words
            .map(w => `<span class="reveal-word">${w}</span>`)
            .join(' ');
        const wordEls = textEl.querySelectorAll('.reveal-word');

        btn.disabled = true;

        // Если в data-audio указан свой mp3 — играем его вместо голоса браузера,
        // а слова просто проявляются по таймеру с выбранной скоростью
        if (customAudioSrc) {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            const audio = new Audio(customAudioSrc);
            audio.onended = () => { btn.disabled = false; };
            audio.onerror = () => {
                wordEls.forEach(w => w.classList.add('shown'));
                btn.disabled = false;
            };
            audio.play().catch(() => {
                wordEls.forEach(w => w.classList.add('shown'));
                btn.disabled = false;
            });
            revealByTimer(wordEls, btn, speedSettings.interval, false);
            return;
        }

        if (!('speechSynthesis' in window)) {
            // Если синтез речи недоступен — просто показываем слова по таймеру
            revealByTimer(wordEls, btn, speedSettings.interval);
            return;
        }

        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(fullText);
        utter.lang = 'en-US';
        utter.rate = speedSettings.rate;

        let wordIndex = 0;
        let boundaryFired = false;

        utter.onboundary = (e) => {
            if (e.name === 'word' && wordIndex < wordEls.length) {
                boundaryFired = true;
                wordEls[wordIndex].classList.add('shown');
                wordIndex++;
            }
        };

        utter.onend = () => {
            wordEls.forEach(w => w.classList.add('shown'));
            btn.disabled = false;
        };

        utter.onerror = () => {
            wordEls.forEach(w => w.classList.add('shown'));
            btn.disabled = false;
        };

        window.speechSynthesis.speak(utter);

        // Запасной вариант: если браузер не поддерживает onboundary
        // (например, некоторые версии Safari), показываем слова по таймеру
        setTimeout(() => {
            if (!boundaryFired) revealByTimer(wordEls, btn, speedSettings.interval);
        }, 350);
    }

    // manageButton = false используется, когда кнопку разблокирует не таймер,
    // а окончание своего аудиофайла (см. customAudioSrc выше)
    function revealByTimer(wordEls, btn, interval, manageButton = true) {
        let i = 0;
        const timer = setInterval(() => {
            if (i >= wordEls.length) {
                clearInterval(timer);
                if (manageButton) btn.disabled = false;
                return;
            }
            wordEls[i].classList.add('shown');
            i++;
        }, interval);
    }

    function triggerFreeze() {
        let overlay = document.getElementById('freeze-overlay');
        if (!overlay) {
            overlay = document.createElement('div');
            overlay.id = 'freeze-overlay';
            overlay.className = 'freeze-overlay';
            overlay.textContent = 'FREEZE! ❄️';
            document.body.appendChild(overlay);
        }
        overlay.style.display = 'flex';
        speak('Freeze!');
        setTimeout(() => { overlay.style.display = 'none'; }, 2000);
    }

    function hideRandomCard() {
        const cards = document.querySelectorAll('#missing-grid .game-card');
        cards.forEach(c => c.classList.remove('hidden-card'));
        const visible = Array.from(cards);
        const target = visible[Math.floor(Math.random() * visible.length)];
        target.classList.add('hidden-card');
    }
    </script>

</body>
</html>
