<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Trial Lesson for Kids</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #45a049;
            --bg-color: #f0f8ff;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        /* Навигация по этапам */
        .navigation {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-btn {
            background-color: #ddd;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .nav-btn.active {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }

        /* Контейнер для слайдов */
        .slide-container {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 30px;
            width: 90%;
            max-width: 800px;
            min-height: 450px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .slide-container.active {
            display: flex;
        }

        h1 { font-size: 2.5rem; margin-top: 0; color: #2c3e50; }
        p { font-size: 1.5rem; color: #7f8c8d; }

        /* Стили для карточек животных */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
            width: 100%;
        }

        .card {
            background: #f9f9f9;
            border: 4px solid #e0e0e0;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: scale(1.03);
            border-color: var(--primary);
        }

        .card img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .card .word {
            font-size: 1.8rem;
            font-weight: bold;
            margin-top: 10px;
            color: #2c3e50;
        }

        /* Специальные анимации и кнопки */
        .btn-action {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
            font-weight: bold;
            transition: transform 0.2s;
        }

        .btn-action:hover { transform: scale(1.05); }

        .hidden-card {
            visibility: hidden;
            opacity: 0;
        }

        /* Анимация для заморозки (Freeze) */
        .freeze-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 188, 212, 0.8);
            color: white;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 5rem;
            font-weight: bold;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <!-- НАВИГАЦИЯ: Теперь мы передаем 'this' (саму кнопку) внутрь функции -->
    <div class="navigation">
        <button class="nav-btn active" onclick="switchSlide(1, this)">1. Hello</button>
        <button class="nav-btn" onclick="switchSlide(2, this)">2. Animals</button>
        <button class="nav-btn" onclick="switchSlide(3, this)">3. TPR Game</button>
        <button class="nav-btn" onclick="switchSlide(4, this)">4. What's Missing?</button>
        <button class="nav-btn" onclick="switchSlide(5, this)">5. Well Done!</button>
    </div>

       <!-- СЛАЙД 1: Интерактивное приветствие со сменой эмоций -->
    <div id="slide1" class="slide-container active">
        <h1>Hello! 👋</h1>
        <p>Let's talk and sing together!</p>
        
        <!-- КАРТИНКА ПЕРСОНАЖА (по умолчанию стоит картинка вопроса) -->
        <img src="character-ask.png" alt="Mascot" id="main-character-img" style="width: 150px; height: 150px; object-fit: contain; margin: 15px 0; filter: drop-shadow(0px 5px 10px rgba(0,0,0,0.15)); transition: transform 0.2s, filter 0.2s;">


        <div style="position: relative; width: 100%; max-width: 480px; padding-bottom: 56.25%; height: 0; margin: 15px 0; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">
            <iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" src="https://www.youtube.com/embed/wKXXT244yFI?si=H1sWprKCzk_Gx_ik" allowfullscreen></iframe>
        </div>

        <!-- КНОПКИ ДИАЛОГА: Передают текст и меняют эмоцию (1 - вопрос, 2 - реакция) -->
        <div style="display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 500px; margin: 15px auto;">
            
            <!-- Блок 1: Имя -->
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="nav-btn" style="background: #e3f2fd; color: #1565c0; flex: 1;" onclick="mascotAction('What is your name?', 1)">❓ Ask Name</button>
                <button class="nav-btn" style="background: #e8f5e9; color: #2e7d32; flex: 1;" onclick="mascotAction('Wow! What a beautiful name! I like it!', 2)">🗣️ React to Name</button>
            </div>

            <!-- Блок 2: Возраст -->
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="nav-btn" style="background: #e3f2fd; color: #1565c0; flex: 1;" onclick="mascotAction('How old are you?', 1)">❓ Ask Age</button>
                <button class="nav-btn" style="background: #e8f5e9; color: #2e7d32; flex: 1;" onclick="mascotAction('Wow, six! You are so big! I am only five!', 2)">🗣️ React to Age</button>
            </div>

            <!-- Блок 3: Настроение -->
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="nav-btn" style="background: #e3f2fd; color: #1565c0; flex: 1;" onclick="mascotAction('How are you today?', 1)">❓ Ask: How are you?</button>
                <button class="nav-btn" style="background: #e8f5e9; color: #2e7d32; flex: 1;" onclick="mascotAction('Super! I am happy too! Let us play!', 2)">🗣️ React: Happy!</button>
            </div>

        </div>

        <button class="btn-action" onclick="speak('Let us play with animals!')">🚀 Go to Animals!</button>
    </div>

        <!-- Кнопки-подсказки для озвучки вопросов -->
        <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 15px;">
            <button class="nav-btn" style="background: #e3f2fd; color: #1565c0;" onclick="speak('What is your name?')">❓ Name?</button>
            <button class="nav-btn" style="background: #e3f2fd; color: #1565c0;" onclick="speak('How old are you?')">❓ How old?</button>
            <button class="nav-btn" style="background: #e3f2fd; color: #1565c0;" onclick="speak('How are you?')">❓ How are you?</button>
        </div>

        <button class="btn-action" onclick="speak('Let us play with animals!')">🚀 Go to Animals!</button>
    </div>


    <!-- СЛАЙД 2: Изучение слов -->
    <div id="slide2" class="slide-container">
        <h1>Listen and Repeat! 🐾</h1>
        <div class="grid">
            <div class="card" onclick="speak('Cat')">
                <img src="https://icons8.com" alt="cat">
                <div class="word">a cat</div>
            </div>
            <div class="card" onclick="speak('Dog')">
                <img src="https://icons8.com" alt="dog">
                <div class="word">a dog</div>
            </div>
            <div class="card" onclick="speak('Lion')">
                <img src="https://icons8.com" alt="lion">
                <div class="word">a lion</div>
            </div>
            <div class="card" onclick="speak('Frog')">
                <img src="https://icons8.com" alt="frog">
                <div class="word">a frog</div>
            </div>
        </div>
    </div>

    <!-- СЛАЙД 3: Физкультминутка -->
    <div id="slide3" class="slide-container">
        <h1>Let's Move! 🏃‍♂️</h1>
        <p>Listen and do actions!</p>
        <div style="display: flex; gap: 20px; margin-bottom: 20px;">
            <button class="btn-action" style="background:#4caf50;" onclick="speak('Jump like a frog')">🐸 Jump!</button>
            <button class="btn-action" style="background:#2196f3;" onclick="speak('Run like a lion')">🦁 Run!</button>
        </div>
        <button class="btn-action" style="background:#f44336; width: 80%;" onclick="triggerFreeze()">🥶 FREEZE!</button>
    </div>

    <!-- СЛАЙД 4: Игра "What's missing?" -->
    <div id="slide4" class="slide-container">
        <h1>What's Missing? 🤔</h1>
        <p>Закрой глаза, а учитель спрячет животное!</p>
        <button class="btn-action" style="background:#9c27b0; margin-bottom: 20px;" onclick="hideRandomCard()">🙈 Hide Animal</button>
        <div class="grid" id="missing-grid">
            <div class="card game-card" data-name="a cat">
                <img src="https://icons8.com" alt="cat">
                <div class="word">a cat</div>
            </div>
            <div class="card game-card" data-name="a dog">
                <img src="https://icons8.com" alt="dog">
                <div class="word">a dog</div>
            </div>
            <div class="card game-card" data-name="a lion">
                <img src="https://icons8.com" alt="lion">
                <div class="word">a lion</div>
            </div>
            <div class="card game-card" data-name="a frog">
                <img src="https://icons8.com" alt="frog">
                <div class="word">a frog</div>
            </div>
        </div>
    </div>

    <!-- СЛАЙД 5: Финал -->
    <div id="slide5" class="slide-container">
        <h1>Super Job! 🎉</h1>
        <p>You get a star!</p>
        <div style="font-size: 7rem; margin: 20px;">⭐</div>
        <button class="btn-action" onclick="speak('Goodbye! See you next time!')">👋 Goodbye!</button>
    </div>

    <!-- Эффект заморозки -->
    <div id="freezeOverlay" class="freeze-overlay" onclick="this.style.display='none'">🥶 FREEZE!</div>

    <!-- ИСПРАВЛЕННЫЙ СКРИПТ -->
    <script>
        function switchSlide(slideNumber, buttonElement) {
            // 1. Скрываем все слайды и убираем подсветку со всех кнопок
            document.querySelectorAll('.slide-container').forEach(slide => slide.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            
            // 2. Показываем нужный слайд
            const targetSlide = document.getElementById('slide' + slideNumber);
            if (targetSlide) {
                targetSlide.classList.add('active');
            }
            
            // 3. Подсвечиваем активную кнопку
            if (buttonElement) {
                buttonElement.classList.add('active');
            }

            // 4. Сброс игры "What's missing", если зашли на 4 вкладку
            if(slideNumber === 4) {
                document.querySelectorAll('.game-card').forEach(card => card.classList.remove('hidden-card'));
            }
        }

        function speak(text) {
            window.speechSynthesis.cancel(); // Сбрасываем старую озвучку, если кликнули быстро
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.8; 
            window.speechSynthesis.speak(utterance);
        }

        function hideRandomCard() {
            const cards = document.querySelectorAll('.game-card');
            cards.forEach(card => card.classList.remove('hidden-card'));
            
            const randomIndex = Math.floor(Math.random() * cards.length);
            setTimeout(() => {
                cards[randomIndex].classList.add('hidden-card');
                speak("Open your eyes! What's missing?");
            }, 100);
        }

        function triggerFreeze() {
            const overlay = document.getElementById('freezeOverlay');
            overlay.style.display = 'flex';
            speak("Freeze!");
            setTimeout(() => { overlay.style.display = 'none'; }, 2500);
        }
    </script>
</body>

       <script>     // Функция для управления маскотом (озвучка + смена эмоций)
        function mascotAction(text, mode) {
            const imgElement = document.getElementById('main-character-img');
            
            if (mode === 1) {
                // Включаем картинку вопроса
                imgElement.src = 'character-ask.png';
                imgElement.style.transform = 'scale(1)';
            } else if (mode === 2) {
                // Включаем картинку реакции и добавляем эффект прыжка
                imgElement.src = 'character-react.png';
                imgElement.style.transform = 'scale(1.25)';
                
                // Через секунду возвращаем в нормальный размер, но оставляем радостное лицо
                setTimeout(() => {
                    imgElement.style.transform = 'scale(1.1)';
                }, 300);
            }
            
            // Запускаем озвучку текста
            speak(text);
        }
       </script>
