<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match the vocabulary to the idea</title>
<style>
:root{
  --ink:#1f2937;
  --muted:#6b7280;
  --line:#e5e7eb;
  --bg:#f7f9fc;
  --accent:#2f6fed;
  --accent-soft:#e8f0ff;
  --good:#16a34a;
  --good-soft:#eafaf1;
  --wrong:#dc2626;
  --wrong-soft:#fdecec;
}
*{box-sizing:border-box;}
body{
  margin:0;
  padding:28px 18px 60px;
  font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);
  color:var(--ink);
}
.wrap{max-width:1100px;margin:0 auto;}

header{margin-bottom:6px;}
h1{
  font-size:24px;
  margin:0 0 6px;
}
.subtitle{
  font-size:15px;
  color:var(--muted);
  margin:0;
}

.toolbar{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin:18px 0 14px;
}
.score{
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 18px;
  font-weight:700;
  font-size:15px;
}
.score span{color:var(--accent);}
button.tool{
  font-family:inherit;
  font-size:14px;
  font-weight:600;
  border:1px solid var(--line);
  background:#fff;
  color:#374151;
  padding:8px 16px;
  border-radius:999px;
  cursor:pointer;
}
button.tool:hover{background:#f3f4f6;}
button.tool.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
button.tool.primary:hover{background:#2560d8;}

/* Банк слов */
.bank{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  min-height:76px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:22px;
}
.bank.empty::after{
  content:"Все выражения разложены 👇";
  color:var(--muted);
  font-size:14px;
  margin:auto;
}

.chip{
  border:2px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:9px 16px;
  font-size:15px;
  font-weight:600;
  cursor:grab;
  user-select:none;
  transition:transform .12s ease,border-color .15s ease,background .15s ease;
}
.chip:hover{border-color:var(--accent);background:var(--accent-soft);}
.chip.selected{
  border-color:var(--accent);
  background:var(--accent-soft);
  transform:scale(1.04);
}
.chip.dragging{opacity:.45;}
.chip.placed{
  cursor:default;
  border-color:var(--good);
  background:var(--good-soft);
}
.chip.wrong{
  animation:shake .35s ease;
  border-color:var(--wrong);
  background:var(--wrong-soft);
}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-6px);}
  75%{transform:translateX(6px);}
}

/* Категории */
.categories{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
}
.category{
  background:#fff;
  border:2px dashed var(--line);
  border-radius:16px;
  padding:14px;
  min-height:160px;
  transition:border-color .15s ease,background .15s ease;
}
.category.over{
  border-color:var(--accent);
  background:var(--accent-soft);
}
.category.complete{
  border-style:solid;
  border-color:var(--good);
}
.cat-title{
  font-size:15px;
  font-weight:700;
  margin-bottom:4px;
}
.cat-count{
  font-size:13px;
  color:var(--muted);
  margin-bottom:12px;
}
.cat-items{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.banner{
  margin-top:26px;
  text-align:center;
  font-size:18px;
  font-weight:700;
  color:var(--good);
  opacity:0;
  transition:opacity .3s ease;
}
.banner.show{opacity:1;}

@media(max-width:600px){
  .chip{font-size:14px;padding:8px 14px;}
  h1{font-size:20px;}
}
</style>
</head>
<body>

<div class="wrap">

  <header>
    <h1>Match the vocabulary to the idea</h1>
    <p class="subtitle">Перетащи выражение в нужную категорию — или нажми на слово, а потом на категорию.</p>
  </header>

  <div class="toolbar">
    <div class="score">Разложено: <span id="placed">0</span> / <span id="total">0</span></div>
    <button class="tool" id="hintBtn">💡 Подсказка</button>
    <button class="tool primary" id="restartBtn">🔄 Заново</button>
  </div>

  <div class="bank" id="bank"></div>

  <div class="categories" id="categories"></div>

  <div class="banner" id="banner">✅ Отлично! Вся лексика разложена верно.</div>

</div>

<script>
/*
  ЧТОБЫ ПОМЕНЯТЬ СОДЕРЖАНИЕ — редактируйте этот объект.
  Ключ — название категории, значение — список выражений.
*/
const DATA = {
  "Experience & performance": [
    "track record",
    "accomplishment",
    "relevant experience",
    "technical competency",
    "excel"
  ],
  "Work environment": [
    "pace",
    "intensity",
    "resources",
    "complexity",
    "work environment"
  ],
  "Management & relationships": [
    "managerial fit",
    "hiring manager",
    "coach",
    "delegate",
    "decision-making"
  ],
  "Work processes": [
    "assignment",
    "search assignment",
    "deal with a problem",
    "handle a situation",
    "solve a problem"
  ],
  "Professional concepts": [
    "retained search",
    "culture fit",
    "map X to Y",
    "comparable experience"
  ]
};

const bank = document.getElementById('bank');
const categoriesEl = document.getElementById('categories');
const placedEl = document.getElementById('placed');
const totalEl = document.getElementById('total');
const banner = document.getElementById('banner');

let selectedChip = null;
let placedCount = 0;
let totalCount = 0;

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function build(){
  bank.innerHTML = '';
  categoriesEl.innerHTML = '';
  banner.classList.remove('show');
  bank.classList.remove('empty');
  selectedChip = null;
  placedCount = 0;

  // Собираем все выражения с пометкой правильной категории
  const allTerms = [];
  Object.keys(DATA).forEach(cat => {
    DATA[cat].forEach(term => allTerms.push({ term, cat }));
  });
  totalCount = allTerms.length;
  totalEl.textContent = totalCount;
  placedEl.textContent = 0;

  // Банк слов — перемешанный
  shuffle(allTerms).forEach(item => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = item.term;
    chip.dataset.cat = item.cat;
    chip.draggable = true;

    chip.addEventListener('click', () => selectChip(chip));
    chip.addEventListener('dragstart', e => {
      selectedChip = chip;
      chip.classList.add('dragging');
      e.dataTransfer.setData('text/plain', item.term);
    });
    chip.addEventListener('dragend', () => chip.classList.remove('dragging'));

    bank.appendChild(chip);
  });

  // Категории — тоже в случайном порядке
  shuffle(Object.keys(DATA)).forEach(cat => {
    const box = document.createElement('div');
    box.className = 'category';
    box.dataset.cat = cat;
    box.innerHTML = `
      <div class="cat-title">${cat}</div>
      <div class="cat-count">0 / ${DATA[cat].length}</div>
      <div class="cat-items"></div>
    `;

    box.addEventListener('click', () => {
      if(selectedChip) tryPlace(selectedChip, box);
    });
    box.addEventListener('dragover', e => {
      e.preventDefault();
      box.classList.add('over');
    });
    box.addEventListener('dragleave', () => box.classList.remove('over'));
    box.addEventListener('drop', e => {
      e.preventDefault();
      box.classList.remove('over');
      if(selectedChip) tryPlace(selectedChip, box);
    });

    categoriesEl.appendChild(box);
  });
}

function selectChip(chip){
  if(chip.classList.contains('placed')) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
  chip.classList.add('selected');
  selectedChip = chip;
}

function tryPlace(chip, box){
  if(chip.classList.contains('placed')) return;

  if(chip.dataset.cat === box.dataset.cat){
    chip.classList.remove('selected');
    chip.classList.add('placed');
    chip.draggable = false;
    box.querySelector('.cat-items').appendChild(chip);

    const done = box.querySelectorAll('.chip').length;
    const need = DATA[box.dataset.cat].length;
    box.querySelector('.cat-count').textContent = `${done} / ${need}`;
    if(done === need) box.classList.add('complete');

    placedCount++;
    placedEl.textContent = placedCount;
    selectedChip = null;

    if(!bank.querySelector('.chip')) bank.classList.add('empty');
    if(placedCount === totalCount){
      setTimeout(() => banner.classList.add('show'), 250);
    }
  } else {
    chip.classList.add('wrong');
    setTimeout(() => {
      chip.classList.remove('wrong', 'selected');
      selectedChip = null;
    }, 400);
  }
}

// Подсказка: подсвечивает нужную категорию для выбранного слова
document.getElementById('hintBtn').addEventListener('click', () => {
  const chip = selectedChip || bank.querySelector('.chip:not(.placed)');
  if(!chip) return;
  selectChip(chip);
  const box = categoriesEl.querySelector(`.category[data-cat="${chip.dataset.cat}"]`);
  if(!box) return;
  box.classList.add('over');
  setTimeout(() => box.classList.remove('over'), 1200);
});

document.getElementById('restartBtn').addEventListener('click', build);

build();
</script>
</body>
</html>
